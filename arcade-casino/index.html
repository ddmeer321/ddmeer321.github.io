<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Neonpalast – ein Arcade-Casino im Browser mit Blackjack, Roulette, Slots, Coin Pusher und Skill-Automaten. Ausschließlich virtuelles Spielgeld, keine Käufe, keine Auszahlungen." />
    <meta name="theme-color" content="#0b0614" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff3d9a'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-weight='900' font-family='system-ui' fill='%23fff'%3EN%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/tokens.css?v=4" />
    <link rel="stylesheet" href="css/base.css?v=4" />
    <link rel="stylesheet" href="css/components.css?v=4" />
    <link rel="stylesheet" href="css/hub.css?v=4" />
    <link rel="stylesheet" href="css/games.css?v=4" />
    <title>Neonpalast – Arcade-Casino (nur Spielgeld)</title>
  </head>
  <body>
    <div id="app">
      <header class="hud" id="hud">
        <div class="hud-left" id="hud-left"></div>
        <div class="hud-right">
          <button class="pill balance num" id="hud-balance" type="button" aria-label="Guthaben">
            <span class="coin-ico" aria-hidden="true"></span><span id="hud-balance-value">0</span>
          </button>
          <button class="pill level-pill" id="hud-level" type="button" aria-label="Level und Erfolge">
            <span class="level-ring" id="hud-level-ring"><span id="hud-level-value">1</span></span>
          </button>
          <button class="btn btn-ghost btn-icon btn-sm hud-inbox" id="hud-inbox" type="button" aria-label="Posteingang">📬<span class="hud-badge num" id="hud-inbox-badge" hidden>0</span></button>
          <button class="btn btn-ghost btn-icon btn-sm" id="hud-control" type="button" aria-label="Spielkontrolle: Pause, Auszeit und Hilfe"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></button>
          <button class="btn btn-ghost btn-icon btn-sm" id="hud-settings" type="button" aria-label="Einstellungen">⚙️</button>
        </div>
      </header>
      <main class="views">
        <section class="view view-hub" id="view-hub" aria-label="Casino-Halle"></section>
        <section class="view view-game" id="view-game" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast-layer" id="toast-layer" aria-live="polite"></div>
    <div class="modal-layer" id="modal-layer"></div>
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <noscript><p style="padding:24px;color:#fff">Neonpalast braucht JavaScript.</p></noscript>
    <script type="module" src="js/main.js?v=4"></script>
  </body>
</html>
