name: Wake Render

'on':
  push:
    branches: [main]
    paths:
      - 'whatsapp-post.json'
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 'https://whatsapp-ki.onrender.com/health'; then
              echo 'Render is awake'
              exit 0
            fi
            sleep 15
          done
          exit 1
