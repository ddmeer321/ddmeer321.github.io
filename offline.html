<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#fff6ea" />
    <title>Offline – Spielebibliothek</title>
    <style>
      :root{color-scheme:light}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
        background:radial-gradient(circle at 12% 8%,rgba(124,92,255,.14),transparent 30rem),#fff6ea;
        color:#241c3d;line-height:1.6;
        font-family:"Baloo 2",Poppins,ui-rounded,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .k{max-width:26rem;text-align:center}
      h1{margin:0 0 10px;font-size:clamp(1.6rem,6vw,2.2rem)}
      p{margin:0 0 14px;color:#6b6285}
      ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
      a.s{display:block;padding:13px 18px;border-radius:14px;background:#fff;
        border:1px solid rgba(36,28,61,.08);color:#241c3d;text-decoration:none;font-weight:800;
        box-shadow:0 6px 18px rgba(36,28,61,.05)}
      a.s:hover{border-color:#7c5cff}
      small{display:block;margin-top:18px;color:#6b6285;font-size:.82rem}
    </style>
  </head>
  <body>
    <div class="k">
      <h1>Gerade kein Netz</h1>
      <!-- Keine leere Entschuldigung: Zwei Spiele laufen ohne Verbindung,
           also stehen sie hier als Angebot statt als Trostpflaster. -->
      <p>Diese Seite war noch nicht da, als die Verbindung wegging. Zwei Spiele gehen trotzdem:</p>
      <ul>
        <li><a class="s" href="/reaction/">⚡ REACTION! spielen</a></li>
        <li><a class="s" href="/tic-tac-toe/">⭕ Tic-Tac-Toe spielen</a></li>
      </ul>
      <small>Anmelden, Bestenlisten und Trading brauchen eine Verbindung.</small>
    </div>
  </body>
</html>
